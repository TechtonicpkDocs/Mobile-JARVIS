plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'pk.techtonic.jarvis'
    compileSdk 34

    defaultConfig {
        applicationId "pk.techtonic.jarvis"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        // Stable debug signing — the committed debug.keystore (base64 text
        // at repo root) is decoded by CI to ~/.android/debug.keystore.
        // Standard debug credentials (android/android/androiddebugkey).
        debug {
            storeFile new File(System.getProperty("user.home"), ".android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    // No third-party dependencies by design: Android SDK + Kotlin stdlib
    // only. Keeps CI fast and the local compile gate to android.jar alone.
}
