name: Build Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore committed debug keystore
        # Stable debug signing: ONE debug keystore for all CI runs, committed
        # at repo root as debug.keystore (base64 text). DEBUG ONLY, standard
        # debug credentials (android/android/androiddebugkey). Every run signs
        # with this same key, so debug APKs update-install over each other.
        run: |
          mkdir -p ~/.android
          base64 -d debug.keystore > ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E 'Alias|SHA256'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-jarvis-v1.0.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
